  account_type: MARGIN
  oms_type: NETTING
  starting_balances:
    - amount: 100000
      currency: USDT

strategy:
  module: strategy
  class: AdaptiveRegimeStrategy
  config_class: AdaptiveRegimeStrategyConfig
  config:
    order_id_tag: "002"
    trade_size: "0.1"
    fast_period: 10
    slow_period: 30
    bb_period: 20
    bb_std: 2.0
