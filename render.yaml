services:
  - type: web
    name: tradepaddy
    env: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: QWEN_API_KEY
        sync: false

